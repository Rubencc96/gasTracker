name: Daily Fuel Price Scraper

on:
  schedule:
    # 06:00 UTC corresponds to 08:00 CEST (Madrid summer/autumn time)
    # In winter (CET), 07:00 UTC corresponds to 08:00 CET
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.check_changes.outputs.data_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run MITECO Data Pipeline
        run: |
          python backend/updater.py

      - name: Check for data changes
        id: check_changes
        run: |
          git add frontend/public/data/stations.json
          if ! git diff --staged --quiet; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in stations.json."
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes detected."
          fi

      - name: Commit and push updated stations data
        if: steps.check_changes.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): daily fuel price update [skip ci]"
          git push origin main

      - name: Set up Node.js (for Pages update)
        if: steps.check_changes.outputs.data_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        if: steps.check_changes.outputs.data_changed == 'true'
        run: |
          cd frontend
          npm ci

      - name: Build frontend with Vite
        if: steps.check_changes.outputs.data_changed == 'true'
        run: |
          cd frontend
          npm run build

      - name: Configure GitHub Pages
        if: steps.check_changes.outputs.data_changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check_changes.outputs.data_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    name: Deploy updated data to GitHub Pages
    needs: scrape-and-update
    if: needs.scrape-and-update.outputs.data_changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
